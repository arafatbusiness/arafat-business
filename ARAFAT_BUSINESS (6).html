function pdel(id,i,hk,hid,F){ask('Supprimer ce paiement ?',()=>{find('docs',id).pay.splice(i,1);save();go(V,1);pays(id,hk,hid,F)})}
function dl(t){const T=DT[t],ow=t=='facture'||t=='bc',rows=DB.docs.filter(d=>d.type==t&&(d.num+tname(d)).toLowerCase().includes(Q.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));
return head(TT[t],srch()+`<button class="b" onclick="dgo('${t}')">+ Nouveau</button>`)+tbl(['N°','Date','Tiers','Total'].concat(ow?['Payé','Reste']:[],['Statut','']),rows.map(d=>{const r=tot(d)-paid(d),st=t=='facture'?(r<=0?'Payée':paid(d)>0?'Partielle':'Impayée'):t=='bc'?(d.recu?'Reçu':'En attente'):(d.conv?'Converti':'Ouvert');
return[d.num,d.date,esc(tname(d)),fmt(tot(d))].concat(ow?[fmt(paid(d)),fmt(r)]:[],[`<span class="pill ${['Payée','Reçu','Converti'].includes(st)?'ok':'wa'}">${st}</span>`,`<span class="act"><button class="b2" onclick="pv('${d.id}')">👁</button><button class="b2" onclick="ded('${t}','${d.id}')">✎</button>${owes(d)?`<button class="b2" onclick="pay('${d.id}')">💰</button>`:''}${t=='bc'&&!d.recu?`<button class="b2" onclick="recv('${d.id}')">📥 Réceptionner</button>`:''}${t=='devis'||t=='proforma'?`<button class="b2" onclick="conv('${d.id}','facture')">→ Facture</button>`:''}${t=='facture'?`<button class="b2" onclick="conv('${d.id}','bl')">→ BL</button>`:''}${paid(d)>0?`<button class="b2" onclick="pays('${d.id}')">💳</button>`:''}<button class="b2" onclick="dd('${d.id}')">🗑</button></span>`])}).concat(rows.length?[[`<b>TOTAL (${rows.length})</b>`,'','',`<b>${fmt(sum(rows,tot))}</b>`].concat(ow?[`<b>${fmt(sum(rows,paid))}</b>`,`<b>${fmt(sum(rows,d=>tot(d)-paid(d)))}</b>`]:[],['',''])]:[]))}
/* ===== pages documents : même interface que la vente rapide (produits + panier) ===== */
const TT={facture:'🧾 Factures',proforma:'📄 Factures proforma',bc:'📝 Bons de commande',bl:'🚛 Bons de livraison',devis:'💬 Devis'},VB={facture:'la facture',proforma:'la facture proforma',bc:'le bon de commande',bl:'le bon de livraison',devis:'le devis'};
const DM={},DS={},ds=t=>DS[t]||(DS[t]={lines:[],tid:'',date:today(),note:'',cr:'',pm:'Espèces',eid:'',rc:0});
const dpx=(t,p)=>t=='bc'?n(p.pa):n(p.pv);
function ptl(p,oc,u){const lo=n(p.stock)<=n(p.seuil);return `<div class="tw1"><button class="tile" onclick="${oc}">${p.img?`<img src="${PI(p.img)}">`:'<div class="ph">📦</div>'}<div class="ti"><b>${esc(p.nom)}</b><small class="mu">Réf : ${p.ref?esc(p.ref):'—'}</small><small class="mu">📍 Étagère : ${p.etagere?esc(p.etagere):'—'}</small><div class="pi"><span class="${u=='pa'?'u':''}">Achat : ${fmt(p.pa)}</span><span class="${u=='pv'?'u':''}">Vente : ${fmt(p.pv)}</span></div><small class="${lo?'low':'mu'}">Stock : ${n(p.stock)} · Seuil : ${n(p.seuil)}${lo?' ⚠':''}</small></div></button></div>`}
function avail(t,pid){const s=ds(t),p=find('produits',pid);let a=n(p.stock);if(s.eid){const o=find('docs',s.eid);if(o&&owes(o))a+=sum(o.lines.filter(l=>l.pid==pid),l=>n(l.q))}return a}
const used=(t,pid)=>sum(ds(t).lines.filter(x=>x.pid==pid),x=>n(x.q));
function dpage(t){if(DM[t]=='list')return dl(t);const s=ds(t),k=tk(t),T=sum(s.lines,l=>n(l.q)*n(l.p)),o=s.eid?find('docs',s.eid):null,
ps=DB.produits.filter(p=>(p.nom+(p.ref||'')+(p.etagere||'')).toLowerCase().includes(Q.toLowerCase()));
return head(TT[t],srch('🔍 Rechercher un produit…')+`<button class="b" onclick="qpP('${t}')">+ Nouveau produit</button><button class="b2" onclick="dls('${t}')">📋 Liste</button>`)+(o?`<div class="row" style="align-items:center;margin-bottom:8px"><span class="tot">✎ Modification de ${esc(o.num)}</span><button class="b2" onclick="dnw('${t}')">Annuler la modification</button></div>`:'')+`<div class="pos"><div class="tiles">${ps.map(p=>ptl(p,`dadd('${t}','${p.id}')`,t=='bc'?'pa':'pv')).join('')||'<p class="mu">Aucun produit. Ajoutez-en dans « Produits & stocks ».</p>'}</div>
<div class="card"><h3>${o?'Panier · '+esc(o.num):'Panier · '+DT[t][0]}</h3>${s.lines.map((l,i)=>`<div style="margin:6px 0;padding-bottom:6px;border-bottom:1px solid var(--bd)"><div class="row" style="justify-content:space-between;align-items:center;flex-wrap:nowrap">${l.pid?`<span>${esc(l.nm)}</span>`:`<input value="${esc(l.nm)}" placeholder="Désignation" onchange="dnm('${t}',${i},this.value)">`}<button class="b2" onclick="dq('${t}',${i},-999999)">✕</button></div><div class="row" style="justify-content:space-between;align-items:center;margin-top:4px;flex-wrap:nowrap"><span class="row" style="align-items:center;flex-wrap:nowrap"><button class="b2" onclick="dq('${t}',${i},-1)">−</button><input type="number" min="0" step="any" value="${l.q}" style="width:70px;text-align:center" onchange="dqs('${t}',${i},this.value)"><button class="b2" onclick="dq('${t}',${i},1)">+</button></span><input type="number" step="any" value="${l.p}" style="width:120px" onchange="dpr('${t}',${i},this.value)"></div></div>`).join('')||'<p class="mu">Touchez un produit pour l’ajouter.</p>'}
<button class="b2" style="width:100%;margin:4px 0" onclick="dfree('${t}')">+ Ligne libre</button><p class="tot">Total : ${fmt(T)}</p>
${cpick(k,s.tid,`ds('${t}').tid=this.value`,`qcP('${t}')`)}
<label>Date<input type="date" value="${s.date}" onchange="ds('${t}').date=this.value"></label>
${t=='facture'&&!o?modeSel(s.pm,`ds('${t}').pm=this.value;go('${t}',1)`)+(s.pm=='Crédit'?'<p class="mu">Facture à crédit : le montant sera ajouté au solde du client.</p>':`<label>Montant reçu (vide = tout payé)<input type="number" value="${s.cr}" oninput="ds('${t}').cr=this.value"></label>`):''}${t=='bc'&&!(o&&o.recu)?`<label>Réception<select onchange="ds('${t}').rc=+this.value"><option value="0" ${s.rc?'':'selected'}>En attente de livraison</option><option value="1" ${s.rc?'selected':''}>Reçu : ajouter au stock</option></select></label>`:''}
<label>Note<input value="${esc(s.note)}" oninput="ds('${t}').note=this.value"></label>
<button class="b" style="width:100%" onclick="dsave('${t}')">✔ ${o?'Enregistrer les modifications':'Valider '+VB[t]}</button></div></div>`}
function dadd(t,id){const s=ds(t),p=find('produits',id),c=s.lines.find(x=>x.pid==id);if(t=='facture'&&used(t,id)>=avail(t,id))return toast('Stock insuffisant');c?c.q=n(c.q)+1:s.lines.push({pid:id,nm:p.nom,q:1,p:dpx(t,p)});go(t,1)}
function dq(t,i,d){const s=ds(t),l=s.lines[i];l.q=n(l.q)+d;if(l.q<=0)s.lines.splice(i,1);else if(t=='facture'&&l.pid&&used(t,l.pid)>avail(t,l.pid)){l.q-=d;toast('Stock insuffisant')}go(t,1)}
function dqs(t,i,v){const s=ds(t),l=s.lines[i],q=n(v);if(q<=0){s.lines.splice(i,1)}else{const old=l.q;l.q=q;if(t=='facture'&&l.pid&&used(t,l.pid)>avail(t,l.pid)){l.q=old;toast('Stock insuffisant : maximum '+(avail(t,l.pid)-used(t,l.pid)+n(old)))}}go(t,1)}
function dpr(t,i,v){ds(t).lines[i].p=n(v);go(t,1)}
function dnm(t,i,v){ds(t).lines[i].nm=v}
function dfree(t){ds(t).lines.push({pid:'',nm:'',q:1,p:0});go(t,1)}
function dgo(t){DM[t]='new';go(t)}
function dls(t){DM[t]='list';go(t)}
function dnw(t){delete DS[t];DM[t]='new';go(t)}
function ded(t,id){if(!need(t,'a'))return;const d=find('docs',id);DS[t]={lines:d.lines.map(l=>({pid:l.pid||'',nm:l.nm,q:l.q,p:l.p})),tid:d.tid||'',date:d.date,note:d.note||'',cr:'',pm:'Espèces',eid:id,rc:0};DM[t]='new';go(t)}
function qcP(t){qc(tk(t),id=>{closeM();if(id)ds(t).tid=id;go(t,1)})}
function qpP(t){qp(id=>{closeM();if(id&&(t!='facture'||n(find('produits',id).stock)>0))dadd(t,id);else go(t,1)})}
function dsave(t){if(!need(t,'a'))return;const s=ds(t),L=s.lines.filter(l=>l.nm||l.pid).map(l=>({pid:l.pid,nm:l.nm,q:n(l.q),p:n(l.p)}));if(!L.length)return toast('Panier vide');
let d;const ed=!!s.eid;
if(ed){d=find('docs',s.eid);stk(d,-1);Object.assign(d,{date:s.date||today(),tid:s.tid,lines:L,note:s.note});if(t=='bc'&&s.rc)d.recu=true;stk(d,1)}
else{d={id:uid(),type:t,date:s.date||today(),tid:s.tid,lines:L,pay:[],note:s.note};if(t=='facture'&&s.pm=='Crédit'&&!s.tid)return toast('Choisissez un client pour une facture à crédit');d.num=nextNum(t);const T=tot(d);if(t=='facture'){d.mode=s.pm;const r=s.pm=='Crédit'?0:s.cr===''?T:n(s.cr);if(r>0)d.pay.push({date:today(),a:Math.min(r,T),m:s.pm})}if(t=='bc'&&s.rc)d.recu=true;DB.docs.push(d);stk(d,1)}
save();delete DS[t];if(ed)DM[t]='list';go(t,1);toast(DT[t][0]+' '+d.num+(ed?' modifié(e)':' enregistré(e)'));pv(d.id)}
function dd(id){const _d=find('docs',id);if(_d&&!need(_d.type,'s'))return;ask('Supprimer ce document (le stock sera rétabli) ?',()=>{const d=find('docs',id);stk(d,-1);DB.docs=DB.docs.filter(x=>x.id!=id);save();go(V,1)})}
function pay(id,hk,hid){const d=find('docs',id);if(!need(d.type,'a'))return;form('Enregistrer un paiement · '+d.num,[['a','Montant','number'],['date','Date','date'],['m','Mode',MPAY]],{a:Math.max(0,tot(d)-paid(d)),date:today(),m:'Espèces'},r=>{d.pay.push(r);save();closeM();go(V,1);if(hk)hist(hk,hid)},hk?()=>hist(hk,hid):undefined)}
function recv(id){if(!need('bc','a'))return;ask('Marquer comme reçu et ajouter les quantités au stock ?',()=>{const d=find('docs',id);d.recu=true;stk(d,1);save();go(V,1)})}
function conv(id,to){if(!need(to,'a'))return;const d=find('docs',id),o={...JSON.parse(JSON.stringify(d)),id:uid(),type:to,date:today(),pay:[],from:d.num};delete o.conv;delete o.stamps;o.num=nextNum(to);DB.docs.push(o);if(to=='facture')stk(o,1);d.conv=1;save();toast(DT[to][0]+' '+o.num+' créée');DM[to]='list';go(to)}
const NU=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'],NT=['','','vingt','trente','quarante','cinquante','soixante'];
function w100(x,f){if(x<17)return NU[x];if(x<20)return 'dix-'+NU[x-10];if(x<70){const t=Math.floor(x/10),u=x%10;return NT[t]+(u==1?'-et-un':u?'-'+NU[u]:'')}if(x<80)return x==71?'soixante-et-onze':'soixante-'+w100(x-60,f);if(x==80)return f?'quatre-vingts':'quatre-vingt';return 'quatre-vingt-'+w100(x-80,f)}
function w1000(x,f){const h=Math.floor(x/100),r=x%100,c=h?(h==1?'cent':NU[h]+' cent'+(!r&&f?'s':'')):'';return c+(h&&r?' ':'')+(r?w100(r,f):'')}
function words(v){v=Math.round(n(v));if(v<=0)return 'zéro';const g=Math.floor(v/1e9),m=Math.floor(v/1e6)%1000,k=Math.floor(v/1e3)%1000,r=v%1000,a=[];if(g)a.push(w1000(g,true)+(g>1?' milliards':' milliard'));if(m)a.push(w1000(m,true)+(m>1?' millions':' million'));if(k)a.push(k==1?'mille':w1000(k,false)+' mille');if(r)a.push(w1000(r,true));return a.join(' ')}
